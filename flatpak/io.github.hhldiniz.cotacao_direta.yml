# Manifesto do Flatpak para testes locais.
#
# Roda com rede liberada durante o build (`pub get` busca os pacotes do
# pub.dev, e o primeiro `flutter build linux` baixa os artefatos do engine
# Linux do próprio Google) — é isso que o Flathub NÃO permite no build final:
# lá o `flatpak-builder` roda em sandbox sem rede, e cada fonte precisa vir
# pré-baixada e com hash fixado no manifesto.
#
# Para virar um manifesto submetível ao Flathub, falta rodar o pré-processador
# da comunidade Flutter para isso, o flatpak-flutter
# (https://github.com/TheAppgineer/flatpak-flutter): ele baixa e fixa (com
# hash) tanto os pacotes do pub.dev quanto os artefatos do engine, gerando um
# `pubspec-sources.json` e a versão offline deste manifesto. Ver a seção
# "Empacotamento Linux (Flatpak)" do README para o passo a passo.
#
# Testar localmente (precisa de flatpak e flatpak-builder instalados, e do
# runtime/SDK org.freedesktop.Platform//25.08 — `flatpak install
# flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08`):
#
#   flatpak-builder --user --install --force-clean \
#     build-dir flatpak/io.github.hhldiniz.cotacao_direta.yml
#   flatpak run io.github.hhldiniz.cotacao_direta

app-id: io.github.hhldiniz.cotacao_direta
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: cotacao_direta

finish-args:
  # Renderização (Skia via GTK/EGL) e integração com a área de trabalho.
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Busca das cotações (ver lib/repository/).
  - --share=network
  # flutter_local_notifications fala direto com o barramento de sessão
  # (pacote `dbus`, sem passar pelo portal), para os alertas de câmbio (ver
  # lib/util/notification_service_io.dart).
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: cotacao_direta
    buildsystem: simple
    build-options:
      append-path: /run/build/cotacao_direta/flutter/bin
      build-args:
        - --share=network
    build-commands:
      - flutter config --no-analytics --enable-linux-desktop
      - flutter pub get
      - flutter build linux --release
      - install -d /app/lib/cotacao_direta
      - cp -r build/linux/x64/release/bundle/. /app/lib/cotacao_direta/
      - install -d /app/bin
      - ln -s /app/lib/cotacao_direta/cotacao_direta /app/bin/cotacao_direta
      - install -Dm644 flatpak/io.github.hhldiniz.cotacao_direta.desktop
        /app/share/applications/io.github.hhldiniz.cotacao_direta.desktop
      - install -Dm644 flatpak/io.github.hhldiniz.cotacao_direta.metainfo.xml
        /app/share/metainfo/io.github.hhldiniz.cotacao_direta.metainfo.xml
      - install -Dm644 flatpak/icons/io.github.hhldiniz.cotacao_direta-128.png
        /app/share/icons/hicolor/128x128/apps/io.github.hhldiniz.cotacao_direta.png
      - install -Dm644 flatpak/icons/io.github.hhldiniz.cotacao_direta-256.png
        /app/share/icons/hicolor/256x256/apps/io.github.hhldiniz.cotacao_direta.png
      - install -Dm644 flatpak/icons/io.github.hhldiniz.cotacao_direta-512.png
        /app/share/icons/hicolor/512x512/apps/io.github.hhldiniz.cotacao_direta.png
    sources:
      # Repositório do próprio app. Aponta para um commit fixo (não uma
      # branch) porque é o que o Flathub exige; atualize o commit a cada
      # release antes de reenviar o manifesto para lá.
      - type: git
        url: https://github.com/hhldiniz/cotacao_direta.git
        commit: 03ac442b25fcc6670a9b732a491f9b38ce25e42e
      # SDK do Flutter, na mesma versão fixada em .github/workflows/ci.yml
      # (FLUTTER_VERSION). Ao atualizar essa versão, atualize também aqui.
      - type: archive
        url: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.8-stable.tar.xz
        sha256: 672089e001571a9fbb209a495c583580c0c6c73ef98999264ba07fa93ace332d
        dest: flutter
