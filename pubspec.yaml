name: cotacao_direta
description: Um aplicativo simples que mostra a cotação das principais moedas frente ao real
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  sprintf: ^7.0.0
  http: ^1.6.0
  intl: ^0.20.2
  # flutter 1.22 not supported by this lib
  #  flutter_stetho: ^0.6.0-dev.1
  cupertino_icons: ^1.0.6
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  # sqflite não tem implementação para desktop; no Linux o databaseFactory é
  # trocado para o sqflite_common_ffi (SQLite nativo) em tempo de execução.
  sqflite_common_ffi: ^2.3.3
  # sqflite também não tem implementação para web; lá o databaseFactory é
  # trocado para o sqflite_common_ffi_web (SQLite via WASM, persistido no
  # IndexedDB do navegador). Requer rodar
  # `dart run sqflite_common_ffi_web:setup` para gerar os binários em web/.
  sqflite_common_ffi_web: ^1.1.2
  flag: ^7.0.2
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  fl_chart: ^1.1.1
  # Notificações locais para os alertas de câmbio no Android e no Linux; na web
  # elas saem pela Notification API do navegador, sem pacote nenhum (ver
  # lib/util/notification_service_web.dart).
  flutter_local_notifications: ^19.0.0
  workmanager: ^0.10.7

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

# A chave flutter_icons foi deprecada na versão 0.14 do gerador.
# As imagens de origem ficam em assets/launcher/ (1024x1024) e os arquivos
# gerados estão versionados em android/app/src/main/res/, então o build não
# depende de rodar o gerador. Depois de mexer nas imagens de origem, refaça os
# ícones com `dart run flutter_launcher_icons`.
#   icon.png             marca completa (fundo azul + "R$"), usada no ícone
#                        legado dos aparelhos anteriores ao Android 8
#   icon_foreground.png  só a marca em branco, camada de frente do ícone
#                        adaptativo (o inset de 16% a coloca na zona segura)
# A camada monocromática (ícone temático do Android 13+, que segue a cor do
# papel de parede) usa a mesma arte da camada de frente, então as duas apontam
# para icon_foreground.png. O ic_launcher_monochrome gerado a partir dela é
# também o ícone das notificações (ver lib/util/notification_service_io.dart).
flutter_launcher_icons:
  android: true
  ios: false
  image_path_android: "assets/launcher/icon.png"
  image_path_ios: "assets/launcher/icon.png"
  # #02609A é o mesmo azul do theme_color do web/manifest.json e dos ícones da
  # PWA, para o app ter a mesma marca no Android e na web.
  adaptive_icon_background: "#02609A"
  adaptive_icon_foreground: "assets/launcher/icon_foreground.png"
  adaptive_icon_monochrome: "assets/launcher/icon_foreground.png"

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto/Roboto-Italic.ttf
        - asset: fonts/Roboto/Roboto-Regular.ttf
        - asset: fonts/Roboto/Roboto-Bold.ttf