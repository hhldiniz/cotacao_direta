name: cotacao_direta
description: Um aplicativo simples que mostra a cotação das principais moedas frente ao real
version: 1.0.0+1

environment:
  sdk: ">=2.12.0 <3.0.0"

enable-experiment:
  - extension-methods

dependencies:
  flutter:
    sdk: flutter
  sprintf: ^7.0.0
  http: ^1.6.0
  intl: ^0.19.0
  # flutter 1.22 not supported by this lib
  #  flutter_stetho: ^0.6.0-dev.1
  cupertino_icons: ^1.0.6
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  # Roda o sqflite sobre o SQLite nativo, permitindo testar os DAOs sem um
  # emulador/dispositivo.
  sqflite_common_ffi: ^2.3.3

# A chave flutter_icons foi deprecada na versão 0.14 do gerador.
# Atenção: assets/launcher/icon.png não existe no repositório, então
# `dart run flutter_launcher_icons` falha. É preciso adicionar a imagem (ou
# corrigir o caminho) antes de gerar os ícones.
flutter_launcher_icons:
  android: true
  ios: false
  image_path_android: "assets/launcher/icon.png"
  image_path_ios: "assets/launcher/icon.png"

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto/Roboto-Italic.ttf
        - asset: fonts/Roboto/Roboto-Regular.ttf
        - asset: fonts/Roboto/Roboto-Bold.ttf