name: CI

on:
  push:
    branches: [master]
  pull_request:

# Um push novo na mesma branch cancela a execução anterior, que já não interessa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versão fixa de propósito, para que a resolução de dependências não mude
  # sozinha. Deve acompanhar o `environment` do pubspec.yaml. Para atualizar,
  # rode a análise e os testes na versão nova antes de trocar aqui.
  FLUTTER_VERSION: 3.44.8

jobs:
  test:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Os testes de DAO rodam o sqflite sobre o SQLite nativo
      # (sqflite_common_ffi), que carrega a biblioteca do sistema.
      - name: Instala o SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Baixa as dependências
        run: flutter pub get

      # Sem flags: qualquer apontamento do analisador, de info para cima,
      # derruba o CI. O projeto está limpo, e a ideia é que continue.
      - name: Analisa
        run: flutter analyze

      - name: Testa
        run: flutter test

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Baixa as dependências
        run: flutter pub get

      # Build de debug: verifica que o lado Android compila sem depender de
      # chave de assinatura.
      - name: Compila o APK de debug
        run: flutter build apk --debug

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain exigida pelo `flutter doctor` para desenvolvimento desktop
      # Linux (CMake + GTK), além do runtime do sqflite_common_ffi.
      - name: Instala as dependências de build
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Baixa as dependências
        run: flutter pub get

      - name: Compila o app Linux (debug)
        run: flutter build linux --debug
