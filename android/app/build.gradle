plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Credenciais de assinatura do release. O arquivo fica fora do repositório
// (ver .gitignore e a seção "Assinatura do release" do README): na máquina de
// desenvolvimento ele é criado por tool/generate_keystore.sh, e no CI é escrito
// a partir dos secrets do repositório.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// Caminhos relativos em storeFile são resolvidos a partir de android/.
def releaseKeystore = keystoreProperties["storeFile"] != null
        ? rootProject.file(keystoreProperties["storeFile"])
        : null
if (releaseKeystore != null && !releaseKeystore.exists()) {
    throw new GradleException("android/key.properties aponta para uma keystore "
            + "que não existe: ${releaseKeystore}. Rode tool/generate_keystore.sh.")
}

android {
    namespace = "com.example.cotacao_direta"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        // Exigido pelo flutter_local_notifications (ver mensagem de erro do
        // AGP: "requires core library desugaring to be enabled for :app").
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.cotacao_direta"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (releaseKeystore != null) {
            release {
                storeFile = releaseKeystore
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                // keyPassword é opcional: quem gera a chave costuma usar a
                // mesma senha da keystore, e é isso que o keytool faz por
                // padrão num arquivo PKCS12.
                keyPassword = keystoreProperties["keyPassword"]
                        ?: keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Sem key.properties o release ainda compila, assinado com a chave
            // de debug, para que `flutter run --release` funcione sem
            // configuração nenhuma. Com o arquivo presente, sai assinado com o
            // certificado auto assinado do projeto.
            signingConfig = releaseKeystore != null
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
